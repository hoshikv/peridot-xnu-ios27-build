name: peridot-iOS27-arm64e

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: iOS version
        default: "27.0"

concurrency:
  group: peridot-ios27-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-kernel:
    name: Build xnu-10063 arm64e for peridot
    runs-on: macos-latest
    timeout-minutes: 180
    
    env:
      XNU_TAG: xnu-10063.141.1
      XNU_COMMIT: d8b80295118ef25ac3a784134bcf95cd8e88109f
      XNU_ARCH: arm64e
      MACHINE_CONFIG: PERIDOT
      KERNEL_CONFIG: DEVELOPMENT
      IOS_VERSION: 27.0

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone UniXNU (with submodules)
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/UniXNU/UniXNU ../UniXNU

      - name: Set up XNU source
        run: |
          mkdir -p refer .cache
          if [ ! -d refer/xnu/.git ]; then
            git clone --depth 1 --branch xnu-10063.141.1 https://github.com/apple-oss-distributions/xnu.git refer/xnu
          fi
          if [ "$(git -C refer/xnu rev-parse HEAD)" != "d8b80295118ef25ac3a784134bcf95cd8e88109f" ]; then
            echo "Error: unexpected XNU reference revision"
            exit 1
          fi
          if [ ! -d .cache/xnu-work/.git ]; then
            git clone --shared refer/xnu .cache/xnu-work
          fi

      - name: Copy UniXNU patches
        run: |
          mkdir -p patches/xnu patches/xnu-12377
          cp ../UniXNU/patches/xnu/*.patch patches/xnu/
          cp ../UniXNU/patches/xnu-12377/*.patch patches/xnu-12377/

      - name: Apply UniXNU patches for arm64e
        run: |
          cd .cache/xnu-work
          for PATCH in ../../../patches/xnu/*.patch ../../../patches/xnu-12377/*.patch; do
            if [ -f "$PATCH" ]; then
              if ! git apply --reverse --check "$PATCH" >/dev/null 2>&1; then
                echo "Applying $(basename "$PATCH")..."
                git apply --check "$PATCH" && git apply "$PATCH" || echo "Warning: $PATCH failed"
              fi
            fi
          done

      - name: Add peridot machine config
        run: |
          cd .cache/xnu-work
          python3 ../../setup-peridot.py .

      - name: Check available SDKs
        run: |
          ls -la /Applications/Xcode_*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/
          xcodebuild -showsdks

      - name: Check availability.pl locations
        run: |
          find /Applications/Xcode*.app -name "availability.pl" 2>/dev/null | head -10
          # Check if we can find it in the SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          if [ -f "$SDK_PATH/usr/local/libexec/availability.pl" ]; then
            echo "availability.pl found at $SDK_PATH/usr/local/libexec/availability.pl"
          else
            echo "availability.pl NOT found at $SDK_PATH/usr/local/libexec/availability.pl"
            # Search for it
            find /Applications/Xcode*.app -name "availability.pl" 2>/dev/null | head -5
          fi

      - name: Build kernel (macOS)
        run: |
          cd .cache/xnu-work
          
          # Find available iOS SDK
          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          echo "Using SDK: $IOS_SDK_PATH"
          
          # Check if availability.pl exists
          if [ -f "$(xcrun --sdk iphoneos --show-sdk-path)/usr/local/libexec/availability.pl" ]; then
            echo "availability.pl found in SDK"
          else
            echo "WARNING: availability.pl not found in iPhoneOS SDK"
            # Try to find it
            find /Applications/Xcode*.app -name "availability.pl" 2>/dev/null | head -5
          fi
          
          # Build kernel on macOS with Xcode
          mkdir -p ../../build
          RC_DARWIN_KERNEL_VERSION=23.6.0 \
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
          ARCH_CONFIGS=ARM64 \
          MACHINE_CONFIGS=PERIDOT \
          KERNEL_CONFIGS=DEVELOPMENT \
          ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64e \
          KERNELCACHE_ARCH=arm64e \
          HAS_NATIVE_PAC=1 \
          HAS_APPLE_PAC=1 \
          XNU_KERNEL_CHAINED_FIXUPS=1 \
          BUILD_WERROR=0 \
          BUILD_LTO=0 \
          DO_CTFMERGE=0 \
          BUILD_DSYM=0 \
          make -j$(sysctl -n hw.logicalcpu) \
            SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            ARCH_CONFIGS=ARM64 \
            MACHINE_CONFIGS=PERIDOT \
            KERNEL_CONFIGS=DEVELOPMENT \
            ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64e \
            KERNELCACHE_ARCH=arm64e \
            HAS_NATIVE_PAC=1 \
            HAS_APPLE_PAC=1 \
            XNU_KERNEL_CHAINED_FIXUPS=1 \
            BUILD_WERROR=0 \
            BUILD_LTO=0 \
            DO_CTFMERGE=0 \
            BUILD_DSYM=0 \
            CC=clang \
            CXX=clang++ \
            2>&1 | tee ../../build/kernel-build.log
          
          KERNEL_PATH="BUILD/obj/DEVELOPMENT_ARM64E_PERIDOT/mach.development.peridot"
          if [ ! -f "$KERNEL_PATH" ]; then
            echo "Kernel not found at $KERNEL_PATH"
            find BUILD -name "mach.development*" -type f
            exit 1
          fi
          echo "Kernel built successfully: $KERNEL_PATH"
          ls -la "$KERNEL_PATH"
          
          cp "$KERNEL_PATH" ../../build/mach.development.peridot

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: peridot-arm64e-kernel
          path: build/mach.development.peridot
          retention-days: 30

